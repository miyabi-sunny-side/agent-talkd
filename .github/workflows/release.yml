name: release

on:
  push:
    tags:
      - "v*"
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            artifact: agent-talk-linux-x86_64.tar.gz
          - os: macos-latest
            target: aarch64-apple-darwin
            artifact: agent-talk-macos-aarch64.tar.gz
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Check frontend formatting
        working-directory: client
        run: npm run format:check

      - name: Check frontend types
        working-directory: client
        run: npm run check

      - name: Run frontend tests
        working-directory: client
        run: npm test

      - name: Build embedded frontend
        working-directory: client
        run: npm run build

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          targets: ${{ matrix.target }}

      - uses: Swatinem/rust-cache@v2
        with:
          key: ${{ matrix.target }}

      - name: Install musl toolchain
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Verify tag matches Cargo version
        if: startsWith(github.ref, 'refs/tags/')
        shell: bash
        run: |
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "v$version" = "$GITHUB_REF_NAME"

      - name: Build release binary
        run: cargo build --release --locked --target "${{ matrix.target }}"

      - name: Package artifact
        shell: bash
        run: |
          cp "target/${{ matrix.target }}/release/agent-talk" agent-talk
          cp "target/${{ matrix.target }}/release/agent-talk-mcp" agent-talk-mcp
          tar -czf "${{ matrix.artifact }}" agent-talk agent-talk-mcp LICENSE
          if [ "$RUNNER_OS" = "macOS" ]; then
            shasum -a 256 "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          else
            sha256sum "${{ matrix.artifact }}" > "${{ matrix.artifact }}.sha256"
          fi

      # 梱包の書き忘れを同じ job で落とす: archive の内容と、取り出した
      # agent-talk-mcp が名乗る version を tag の版と突き合わせる。
      - name: Verify archive contents
        shell: bash
        run: |
          tar -tzf "${{ matrix.artifact }}" | sort > archive-contents
          printf '%s\n' LICENSE agent-talk agent-talk-mcp | sort | diff - archive-contents
          check_dir="$(mktemp -d)"
          tar -xzf "${{ matrix.artifact }}" -C "$check_dir"
          version="$(sed -n 's/^version = "\(.*\)"/\1/p' Cargo.toml | head -1)"
          test "$("$check_dir/agent-talk-mcp" --version)" = "agent-talk-mcp $version"

      - name: Upload workflow artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ matrix.artifact }}
          path: |
            ${{ matrix.artifact }}
            ${{ matrix.artifact }}.sha256

  release:
    if: startsWith(github.ref, 'refs/tags/')
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifacts
        uses: actions/download-artifact@v4
        with:
          path: dist
          merge-multiple: true

      - name: Upload to GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          generate_release_notes: true
          files: dist/*
