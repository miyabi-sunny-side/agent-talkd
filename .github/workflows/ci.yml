name: ci

# main への push では走らせない。ローカルの delivery skill が commit 前に
# 同じ検査を通しており、push 後に赤くなってもゲートとして機能しないため。
# 実際のゲートは PR、確認したいときは手動実行。
on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
          cache-dependency-path: client/package-lock.json

      - name: Install frontend dependencies
        working-directory: client
        run: npm ci

      - name: Check frontend formatting
        working-directory: client
        run: npm run format:check

      - name: Check frontend types
        working-directory: client
        run: npm run check

      - name: Run frontend tests
        working-directory: client
        run: npm test

      - name: Build embedded frontend
        working-directory: client
        run: npm run build

      - uses: dtolnay/rust-toolchain@1.96.0
        with:
          components: clippy, rustfmt

      - uses: Swatinem/rust-cache@v2

      - name: Check formatting
        run: cargo fmt --check

      - name: Run Clippy
        run: cargo clippy --all-targets --all-features --locked -- -D warnings

      - name: Run tests
        run: cargo test --locked

      - name: Run herdr bridge integration tests
        run: cargo test --locked --test bridge -- --ignored
