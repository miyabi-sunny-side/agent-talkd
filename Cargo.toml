[package]
name = "agent-talkd"
version = "0.14.2"
edition = "2024"
rust-version = "1.96"
description = "A herdr-native message broker for interactive coding agents"
license = "MIT"
repository = "https://github.com/miyabi-sunny-side/agent-talkd"
readme = "README.md"
keywords = ["herdr", "cli", "agent", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]
publish = false
build = "build.rs"

[[bin]]
name = "agent-talk"
path = "src/main.rs"

[[bin]]
name = "agent-talk-mcp"
path = "src/bin/agent-talk-mcp.rs"

[dependencies]
anyhow = "1.0"
bytes = "1.11"
flate2 = "1.1"
http-body-util = "0.1"
hyper = { version = "1.8", features = ["http1", "server"] }
hyper-util = { version = "0.1", features = ["tokio"] }
libc = "0.2"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.27"
tokio = { version = "1.49", features = ["fs", "io-std", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[dev-dependencies]
# 受領催促のタイマーを paused clock で検証するため。release build には効かない。
tokio = { version = "1.49", features = ["test-util"] }

[lints.clippy]
all = "warn"
pedantic = "warn"

[profile.release]
lto = true
strip = true
codegen-units = 1
