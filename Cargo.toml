[package]
name = "agent-talkd"
version = "0.4.0"
edition = "2024"
rust-version = "1.85"
description = "A tmux-native message broker for interactive coding agents"
license = "MIT"
repository = "https://github.com/miyabi-sunny-side/agent-talkd"
readme = "README.md"
keywords = ["tmux", "cli", "agent", "claude", "codex"]
categories = ["command-line-utilities", "development-tools"]
publish = false

[[bin]]
name = "agent-talk"
path = "src/main.rs"

[dependencies]
anyhow = "1.0"
flate2 = "1.1"
libc = "0.2"
semver = "1.0"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
sha2 = "0.10"
tar = "0.4"
tempfile = "3.27"
tokio = { version = "1.49", features = ["fs", "io-util", "macros", "net", "process", "rt-multi-thread", "signal", "sync", "time"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter", "fmt"] }

[profile.release]
lto = true
strip = true
codegen-units = 1
